# 웹 서버 설정
server:
  port: 8080 # 서버가 실행될 포트

spring:
  application:
    name: dadok-backend # 애플리케이션 이름

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true # multipart 파일 업로드 활성화
      max-file-size: 10MB # 파일 하나의 최대 크기
      max-request-size: 20MB # 파일과 폼 데이터를 포함한 요청 전체의 최대 크기
    encoding:
      charset: UTF-8

  # 이메일 발송 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: guji253714@guji.ms.kr
    password: soca imwt fnlq jfnw
    properties:
      mail:
        smtp:
          auth: true # SMTP 서버 접속 시 계정 인증 사용
          starttls:
            enable: true # STARTTLS를 사용한 암호화 연결 활성화

  # MySQL 데이터베이스 연결 설정
  datasource:
    # DB 주소, 포트, DB 이름 및 연결 옵션
    # sslMode=REQUIRED: 암호화 연결 필수
    # serverTimezone: JDBC 연결에서 사용할 서버 시간대
    # characterEncoding: 연결에 사용할 문자 인코딩
    url: jdbc:mysql://dadokdb-kanghyogang1202-fa92.l.aivencloud.com:25881/dadokDB?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME} # 외부 설정의 DB 사용자 이름
    password: ${DB_PASSWORD} # 외부 설정의 DB 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버

    # DB 연결을 재사용하는 HikariCP 커넥션 풀 설정
    hikari:
      pool-name: DadokHikariPool # 로그 등에 표시할 커넥션 풀 이름
      maximum-pool-size: 10 # 풀에서 관리할 최대 DB 연결 수
      minimum-idle: 2 # 유지하려는 최소 유휴 연결 수
      connection-timeout: 10000 # 연결을 얻기 위해 대기하는 최대 시간: 10초
      validation-timeout: 5000 # 연결 유효성 검사 제한 시간: 5초

  # JPA / Hibernate 설정
  jpa:
    hibernate:
      # 엔티티를 기준으로 DB 테이블 구조 갱신
      # 운영 환경에서는 스키마 변경을 별도로 관리하는 방식 권장
      ddl-auto: update

    show-sql: true # 실행되는 SQL을 콘솔에 출력
    open-in-view: false # 웹 요청 전체에 걸쳐 영속성 컨텍스트를 유지하지 않음

    properties:
      hibernate:
        format_sql: true # SQL을 줄바꿈과 들여쓰기로 보기 좋게 출력
        jdbc:
          time_zone: Asia/Seoul # JDBC 날짜·시간 바인딩 등에 사용할 시간대

  # JSON 변환 설정
  jackson:
    # 시간대가 적용되는 날짜 타입의 JSON 변환에 사용할 기본 시간대
    # LocalDateTime처럼 시간대가 없는 타입에 시간대를 추가하지는 않음
    time-zone: Asia/Seoul

# 로그 출력 수준 설정
logging:
  level:
    root: info # 전체 기본 로그 수준
    org.hibernate.SQL: debug # Hibernate가 실행하는 SQL 출력
    org.hibernate.orm.jdbc.bind: trace # Hibernate 6의 SQL 바인딩 값 출력
    com.zaxxer.hikari: info # HikariCP의 주요 동작 로그 출력

