server:
  port: 8080
  servlet:
    encoding:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 20MB

spring:
  application:
    name: dadok-backend


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${email}
    password: ${email_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # MySQL 데이터베이스 연결
  datasource:
    url: jdbc:mysql://dadokdb-kanghyogang1202-fa92.l.aivencloud.com:25881/dadokDB?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: DadokHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 5000

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul



  # JSON 날짜 처리
  jackson:
    time-zone: Asia/Seoul
  servlet:
    encoding: { charset: UTF-8, enabled: true, force: true }

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.zaxxer.hikari: info

